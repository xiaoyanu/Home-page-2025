            document.getElementById("span-title").textContent = a.name;
            document.getElementById("span-content").textContent = a.content;
            document.getElementById("two-left-Shadow").style.backgroundImage = "url('https://i1.wp.com/image.thum.io/get/width/660/crop/159/allowJPG/wait/200000/noanimate/" + a.url + "')";

            if (a.github !== "") {

            } else {
